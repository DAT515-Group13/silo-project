# Local development: the app and PostgreSQL only.
# There is no blob storage service: the app talks to real Azure with the settings from .env.dev.
#
#   cp .env.dev.example .env.dev      # then fill in the Azure values and your own secrets
#   docker compose up --build

services:
  db:
    image: postgres:16
    env_file: .env.dev # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes:
      - silo-db:/var/lib/postgresql/data
    ports:
      # Bound to localhost only: the database is for the developer, not for the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates or updates the schema, then exits. The app does not migrate itself, and on
  # an empty database its startup (first admin) fails without the tables.
  migrate:
    build: .
    image: silo-app
    env_file: .env.dev
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    image: silo-app
    env_file: .env.dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
      # Metrics for Prometheus (METRICS_PORT in .env.dev); localhost only.
      - "127.0.0.1:9000:9000"

volumes:
  silo-db:
