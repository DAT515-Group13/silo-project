name: Project CI/CD

# pull request to main -> test, build image, migrate and deploy to dev
# push to main         -> same, deployed to prod
# manual run           -> deploy the selected branch to the chosen environment (use it for staging)
# No path filters: required checks must always report, or docs-only PRs could never merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy the selected branch to this environment"
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.p.outputs.target }}
      image: ${{ steps.p.outputs.image }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          CHOSEN: ${{ inputs.environment }}
          REPO: ${{ github.repository }}
        run: |
          case "$EVENT" in
            workflow_dispatch) target="$CHOSEN" ;;
            push)              target="prod" ;;
            *)                 target="dev" ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPO,,}/silo" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $target"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: silo
          POSTGRES_PASSWORD: silo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U silo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q -m "not azure"

  build:
    needs: [plan, test]
    # Never build or deploy code from forked repositories.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ needs.plan.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [plan, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Runs inside the university network: only this job can reach the cluster API.
    runs-on: [self-hosted, linux, silo-vm]
    timeout-minutes: 15
    environment: ${{ needs.plan.outputs.target }}
    concurrency:
      group: deploy-${{ needs.plan.outputs.target }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.plan.outputs.target }}
      IMAGE: ${{ needs.plan.outputs.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Render manifests
        run: |
          set -euo pipefail
          kubectl kustomize "k8s/overlays/${TARGET}" \
            | sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" > "$RUNNER_TEMP/manifest.yaml"
      - name: Migrate database
        run: |
          set -euo pipefail
          # Jobs are immutable: remove the previous one, then apply config + job only.
          kubectl -n "$TARGET" delete job silo-migrate --ignore-not-found --wait=true
          kubectl apply -f "$RUNNER_TEMP/manifest.yaml" -l 'app.kubernetes.io/component in (config,migrate)'
          if ! kubectl -n "$TARGET" wait --for=condition=complete job/silo-migrate --timeout=180s; then
            kubectl -n "$TARGET" logs job/silo-migrate --tail=50 || true
            exit 1
          fi
      - name: Deploy
        run: |
          set -euo pipefail
          echo "Deploying $IMAGE to $TARGET"
          kubectl apply -f "$RUNNER_TEMP/manifest.yaml" -l 'app.kubernetes.io/component notin (migrate)'
          if ! kubectl -n "$TARGET" rollout status deployment/silo --timeout=240s; then
            kubectl -n "$TARGET" get pods
            kubectl -n "$TARGET" logs deployment/silo --tail=50 || true
            exit 1
          fi
      - name: Verify running image
        run: |
          set -euo pipefail
          running="$(kubectl -n "$TARGET" get deployment silo -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "running: $running"
          [ "$running" = "$IMAGE" ] || { echo "FAIL: expected $IMAGE" >&2; exit 1; }
