apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: silo-config
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/component: config
    literals:
      - APP_ENV=prod
      - BASE_URL=http://localhost:8080
      - AZURE_STORAGE_CONTAINER=files
      - JWT_ISSUER=silo
      - JWT_AUDIENCE=silo-prod
      - INITIAL_ADMIN_USERNAME=admin
      - MAX_FILE_SIZE_BYTES=104857600
      - COOKIE_SECURE=true
patches:
  # Reachable from inside the university network at http://<node-ip>:30083
  - target:
      kind: Service
      name: silo
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30083
  # Two replicas in prod so a rolling update or a node loss does not cause downtime
  - target:
      kind: Deployment
      name: silo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
