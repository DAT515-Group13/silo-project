apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: silo-config
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/component: config
    literals:
      - APP_ENV=dev
      - BASE_URL=http://172.16.0.248:30081
      - AZURE_STORAGE_CONTAINER=files
      - JWT_ISSUER=silo
      - JWT_AUDIENCE=silo-dev
      - INITIAL_ADMIN_USERNAME=admin
      - MAX_FILE_SIZE_BYTES=104857600
      - COOKIE_SECURE=false
      - ENABLE_DOCS=true
patches:
  # Reachable from inside the university network at http://<node-ip>:30081
  - target:
      kind: Service
      name: silo
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30081
