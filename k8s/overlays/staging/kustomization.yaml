apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: silo-config
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/component: config
    literals:
      - APP_ENV=staging
      - BASE_URL=https://staging.152.94.171.92.nip.io:30443
      - AZURE_STORAGE_CONTAINER=files
      - JWT_ISSUER=silo
      - JWT_AUDIENCE=silo-staging
      - INITIAL_ADMIN_USERNAME=admin
      - MAX_FILE_SIZE_BYTES=104857600
      - COOKIE_SECURE=true
      - FORWARDED_ALLOW_IPS=10.244.0.0/16
patches:
# Reached through Traefik at https://staging.152.94.171.92.nip.io:30443.
  - target:
      kind: Ingress
      name: silo
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.152.94.171.92.nip.io
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.152.94.171.92.nip.io
        