service:
  spec:
    type: NodePort
ports:
  web:
    expose:
      default: false        # no plain HTTP from outside
  websecure:
    nodePort: 30443
ingressClass:
  enabled: true
  isDefaultClass: true
metrics:
  prometheus:
    addRoutersLabels: true     # one series per Ingress, i.e. per environment
    service:
      enabled: true
    serviceMonitor:
      enabled: true
