apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo
  labels:
    app.kubernetes.io/name: silo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: silo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: silo
    spec:
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: silo
          image: IMAGE_PLACEHOLDER
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9000
          envFrom:
            - configMapRef:
                name: silo-config # generated per environment in k8s/overlays/*
            - secretRef:
                name: silo-app
          env:
            - name: AZURE_STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: silo-azure # created by scripts/k8s-create-secrets.sh
                  key: AZURE_STORAGE_CONNECTION_STRING
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe: # cheap: no dependency checks, otherwise an Azure outage restarts healthy pods
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe: # checks that Azure Blob is reachable
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
