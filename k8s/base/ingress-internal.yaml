apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
spec:
  ipAllowList:
    sourceRange: [10.0.0.0/8, 172.16.0.0/16]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: silo-health
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: NAMESPACE-internal-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [HOST_PLACEHOLDER]
      secretName: silo-tls
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - { path: /readyz, pathType: Exact, backend: { service: { name: silo, port: { name: http } } } }
          - { path: /healthz, pathType: Exact, backend: { service: { name: silo, port: { name: http } } } }