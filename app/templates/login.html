{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Log in</h1>
    {% if registered %}
    <div class="alert alert-success">Account created. You can log in now.</div>
    {% endif %}
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="mb-3">
        <label class="form-label" for="username">Username</label>
        <input class="form-control" id="username" name="username" value="{{ username }}"
               autocomplete="username" maxlength="32" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password"
               autocomplete="current-password" maxlength="128" required>
      </div>
      <button type="submit" class="btn btn-primary">Log in</button>
      {% if registration_open %}
      <a class="btn btn-link" href="/register">Create an account</a>
      {% endif %}
    </form>
  </div>
</div>
{% endblock %}
