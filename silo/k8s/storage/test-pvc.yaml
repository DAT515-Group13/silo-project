apiVersion: v1
kind: Namespace
metadata:
  name: storage-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-storage-test
  namespace: storage-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-test
  namespace: storage-test
spec:
  nodeSelector:
    kubernetes.io/hostname: silo-w-0
  restartPolicy: Never
  containers:
    - name: test
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          echo "local storage works" > /data/test.txt
          cat /data/test.txt
          sleep 3600
      volumeMounts:
        - name: test-storage
          mountPath: /data
  volumes:
    - name: test-storage
      persistentVolumeClaim:
        claimName: local-storage-test