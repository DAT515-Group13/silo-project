apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: silo-config
    literals:
      - ENVIRONMENT=prod
      - AZURE_CONTAINER=files
patches:
  # Reachable from inside the university network at http://<node-ip>:30083
  - target:
      kind: Service
      name: silo
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30083
  # Two replicas in prod so a rolling update or a node loss does not cause downtime
  - target:
      kind: Deployment
      name: silo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
