apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: silo
  labels:
    app.kubernetes.io/name: silo
    {{- include "silo.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: {{ .Values.tlsSecret }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: silo, port: { name: http } } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange: {{ toJson .Values.internalRanges }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: silo-health
  labels:
    {{- include "silo.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-internal-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [{{ .Values.host }}]
      secretName: {{ .Values.tlsSecret }}
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - { path: /readyz, pathType: Exact, backend: { service: { name: silo, port: { name: http } } } }
          - { path: /healthz, pathType: Exact, backend: { service: { name: silo, port: { name: http } } } }