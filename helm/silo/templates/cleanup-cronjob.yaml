{{- if .Values.cleanup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: silo-cleanup
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: silo-cleanup
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- include "silo.podSecurity" . | nindent 12 }}
          containers:
            - name: cleanup
              image: {{ include "silo.image" . }}
              command: ["python", "-m", "app.cli", "cleanup-orphans"]
              envFrom:
                - configMapRef:
                    name: silo-config
                - secretRef:
                    name: {{ .Values.secrets.app }}
              env:
                {{- include "silo.azureEnv" . | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { memory: 256Mi }
              securityContext:
                {{- include "silo.containerSecurity" . | nindent 16 }}
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: tmp, emptyDir: {} }
{{- end }}