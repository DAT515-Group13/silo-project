{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: silo
  labels:
    {{- include "silo.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: silo
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
{{- end }}